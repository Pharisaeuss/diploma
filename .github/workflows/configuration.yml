name: Application Configuration (Ansible)

on:
  # Uncomment to trigger automatically on changes to ansible/ folder:
  # push:
  #   branches: ["main"]
  #   paths:
  #     - 'ansible/**'
  workflow_dispatch:              # manual trigger from GitHub UI
    inputs:
      target_env:
        description: 'Choose the environment for configuration'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod

env:
  AWS_REGION:   ${{ vars.AWS_REGION }}
  PROJECT_ENV:  ${{ github.event.inputs.target_env || 'dev' }}

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

jobs:
  ansible:
    name: Discover EC2 & Apply Configuration
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ACTIONS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible and AWS Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore

      - name: Install amazon.aws Ansible collection
        run: ansible-galaxy collection install amazon.aws --force

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ansible_key
          chmod 600 ~/.ssh/ansible_key

      - name: Run Ansible playbook
        run: |
          cd ansible
          ansible-playbook playbook.yml \
            --private-key ~/.ssh/ansible_key \
            -e "project_env=${{ env.PROJECT_ENV }}" \
            -e "aws_region=${{ env.AWS_REGION }}"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ansible_key
