name: Application Deployment (Ansible)
on:
#  push:
#    branches: [ "main" ]
#    paths:
#      - 'ansible/**' # Запуск тільки при зміні папки з Ansible
  workflow_dispatch:

env:
  AWS_REGION: "eu-central-1"
  PROJECT_ENV: "dev"

permissions:
  id-token: write
  contents: read

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install AWS Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: Install Ansible and AWS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws --force
          
      - name: Fetch S3 Bucket Name for SSM
        run: |
          BUCKET_NAME=$(aws ssm get-parameter --name "/${{ env.PROJECT_ENV }}/s3/app_bucket_name" --region ${{ env.AWS_REGION }} --query "Parameter.Value" --output text)
          echo "SSM_BUCKET=$BUCKET_NAME" >> $GITHUB_ENV

      - name: Run Ansible Playbook
        run: |
          cd ansible
          ansible-playbook playbook.yml \
            -e "target_env=${{ env.PROJECT_ENV }}" \
            -e "aws_region=${{ env.AWS_REGION }}" \
            -e "ansible_aws_ssm_bucket_name=${{ env.SSM_BUCKET }}"
            
