name: Infrastructure Cleanup (Terragrunt Destroy)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Оберіть середовище для видалення (dev, stage, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod
      confirmation:
        description: 'Введіть "DESTROY" великими літерами для підтвердження'
        required: true
        default: 'NO'

env:
  AWS_REGION: "eu-central-1"
  TG_ENV: ${{ github.event.inputs.environment }}
  TG_STATE_BUCKET: "tfstate-buckets3-2026"

jobs:
  destroy:
    name: 'Terragrunt Destroy'
    runs-on: ubuntu-latest
  
    if: github.event.inputs.confirmation == 'DESTROY'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v0.55.11/terragrunt_linux_amd64
          mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terragrunt Init
        working-directory: ./terraform/environments/${{ env.TG_ENV }}
        run: terragrunt run-all init --terragrunt-non-interactive

      - name: Terragrunt Destroy
        working-directory: ./terraform/environments/${{ env.TG_ENV }}
        run: terragrunt run-all destroy --terragrunt-non-interactive
