name: Infrastructure Creation (Terragrunt)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Choose the environment for deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod

  # Run on merge/push to main
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
      
  # Run check when creating a Pull Request
  pull_request:
    branches: [ "main" ]
    paths:
      - 'terraform/**'

# Global variables
env:
  AWS_REGION: "eu-central-1"
  TG_ENV: ${{ github.event.inputs.target_env || 'dev' }}
  TG_STATE_BUCKET: "tfstate-buckets3-2026"


permissions:
  id-token: write   
  contents: read

jobs:
  terragrunt:
    name: 'Terragrunt Checks & Apply'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.5" 
          terraform_wrapper: false   

      # Install Terragrunt
      - name: Setup Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v0.55.11/terragrunt_linux_amd64
          mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Format Check (HCL)
        working-directory: ./terraform
        run: terragrunt hclfmt --terragrunt-check

      - name: Terragrunt Init
        working-directory: ./terraform/environments/${{ env.TG_ENV }}
        run: terragrunt run-all init --terragrunt-non-interactive

      - name: Validate Code
        working-directory: ./terraform/environments/${{ env.TG_ENV }}
        run: terragrunt run-all validate --terragrunt-non-interactive

      - name: Terragrunt Plan
        id: plan
        working-directory: ./terraform/environments/${{ env.TG_ENV }}
        run: terragrunt run-all plan --terragrunt-non-interactive

      # Runs only if it is a push to main OR a manual run 
      - name: Terragrunt Apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: ./terraform/environments/${{ env.TG_ENV }}
        run: terragrunt run-all apply --terragrunt-non-interactive
        
# 1. Встановлення системних залежностей (Graphviz для рендерингу)
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # 2. Встановлення Inframap (утиліта для парсингу файлів стану)
      - name: Install Inframap
        run: |
          curl -sL https://github.com/cycloidio/inframap/releases/download/v0.7.0/inframap-linux-amd64.tar.gz | tar xz
          sudo mv inframap-linux-amd64 /usr/local/bin/inframap

      # 3. Синхронізація файлів стану безпосередньо з AWS S3
      - name: Download State Files from S3
        # Викачуємо всі .tfstate файли для конкретного середовища (dev/stage/prod)
        run: |
          mkdir -p ./downloaded-states
          aws s3 sync s3://${{ env.TG_STATE_BUCKET }}/ ./downloaded-states --exclude "*" --include "*${{ env.TG_ENV }}/*.tfstate"
          
      # 4. Генерація детальної ресурсної архітектури
# 4. Генерація детальної ресурсної архітектури для КОЖНОГО модуля
      - name: Generate Detailed Infrastructure Graphs
        run: |
          # Створюємо директорію для готових графів
          mkdir -p ./graphs
          
          # Проходимо циклом по кожному завантаженому файлу стану
          find ./downloaded-states -name "*.tfstate" | while read state_file; do
            # Витягуємо назву модуля з шляху (наприклад, 'network' або 'rds')
            module_name=$(basename $(dirname "$state_file"))
            
            echo "Generating graph for module: $module_name"
            
            # Генеруємо граф для конкретного модуля
            inframap generate "$state_file" > "my_infra_${module_name}.dot"
            dot -Tsvg "my_infra_${module_name}.dot" > "./graphs/detailed_architecture_${module_name}_${{ env.TG_ENV }}.svg"
          done

      # 5. Збереження артефактів (всіх згенерованих схем)
      - name: Upload Architecture Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: detailed-aws-infrastructure-graphs-${{ env.TG_ENV }}
          path: ./graphs/*.svg
          retention-days: 2
