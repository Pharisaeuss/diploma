- name: Build FastAPI Base Image Layer
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_dir:  "/var/www/fastapi-crud"
    app_user: "ec2-user"
    app_port: 8000

  tasks:
    - name: Install system dependencies
      yum:
        name:
          - python3
          - python3-pip
          - python3-devel
          - postgresql-devel
          - nginx
          - gcc
          - awscli
        state: present
        update_cache: true

    - name: Create app and config directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ app_dir }}",         owner: "{{ app_user }}", group: "{{ app_user }}", mode: "0755" }
        - { path: "{{ app_dir }}/static",  owner: "{{ app_user }}", group: "{{ app_user }}", mode: "0755" }
        - { path: /etc/fastapi-crud,       owner: root,             group: "{{ app_user }}", mode: "0750" }

    - name: Copy requirements.txt for venv priming
      copy:
        src: templates/requirements.txt
        dest: "{{ app_dir }}/requirements.txt"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"

    - name: Create virtualenv and install Python dependencies
      pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
        virtualenv_command: python3 -m venv

    - name: Install fetch-runtime-env.sh
      copy:
        src: templates/fetch-runtime-env.sh
        dest: /usr/local/bin/fetch-runtime-env.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install fastapi-crud-env.service (SSM oneshot)
      copy:
        src: templates/fastapi-crud-env.service
        dest: /etc/systemd/system/fastapi-crud-env.service
        mode: "0644"

    - name: Install fastapi-crud.service
      template:
        src: templates/fastapi_service.j2
        dest: /etc/systemd/system/fastapi-crud.service
        mode: "0644"

    - name: Enable units (do not start — no app code or SSM yet)
      systemd:
        name: "{{ item }}"
        enabled: true
        daemon_reload: true
      loop:
        - fastapi-crud-env
        - fastapi-crud
        - nginx

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/conf.d/default.conf
        state: absent

    - name: Install Nginx reverse proxy config
      template:
        src: templates/nginx_app_conf.j2
        dest: /etc/nginx/conf.d/fastapi-crud.conf
        mode: "0644"