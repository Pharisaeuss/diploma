- name: Deploy FastAPI App Layer
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_dir:    "/var/www/fastapi-crud"
    app_user:   "ec2-user"
    app_port:   8000
    app_env:    "{{ lookup('env', 'PROJECT_ENV')        | default('dev') }}"
    aws_region: "{{ lookup('env', 'AWS_DEFAULT_REGION') | default('eu-central-1') }}"

  tasks:
    - name: Copy application source files
      copy:
        src: "../app/{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
      loop:
        - main.py
        - database.py
        - models.py
        - schemas.py
        - crud.py
      notify: restart fastapi

    - name: Copy frontend (static/index.html)
      copy:
        src: ../app/static/index.html
        dest: "{{ app_dir }}/static/index.html"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"

    - name: Write bootstrap.env (ENV + AWS_DEFAULT_REGION only)
      copy:
        content: |
          ENV={{ app_env }}
          AWS_DEFAULT_REGION={{ aws_region }}
        dest: /etc/fastapi-crud/bootstrap.env
        owner: root
        group: "{{ app_user }}"
        mode: "0640"

    - name: Flush handlers
      meta: flush_handlers

    - name: Enable services
      systemd:
        name: "{{ item }}"
        enabled: true
        daemon_reload: true
      loop:
        - fastapi-crud-env
        - fastapi-crud

    - name: Start services
      systemd:
        name: "{{ item }}"
        state: started
        daemon_reload: true
      loop:
        - fastapi-crud-env
        - fastapi-crud
      when: start_services | default(true) | bool

    - name: Ensure Nginx is started
      systemd:
        name: nginx
        state: "{{ 'started' if (start_services | default(true) | bool) else omit }}"
        enabled: true

    - name: Wait for FastAPI health endpoint
      uri:
        url: "http://localhost:{{ app_port }}/health"
        return_content: true
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      when: start_services | default(true) | bool

    - name: Print health check result
      debug:
        msg: "Health: {{ health.json }}"
      when:
        - start_services | default(true) | bool
        - health is defined

  handlers:
    - name: restart fastapi
      systemd:
        name: fastapi-crud
        state: restarted
        enabled: true
        daemon_reload: true
      when: start_services | default(true) | bool