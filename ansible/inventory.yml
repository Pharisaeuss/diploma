plugin: aws_ec2
regions:
  - eu-central-1

filters:
  "tag:Environment": "dev"
  "instance-state-name": "running"

hostnames:
  - instance-id

compose:
  ansible_connection: "'amazon.aws.aws_ssm'"
  ansible_user: "'ec2-user'"
  ansible_aws_ssm_region: "'eu-central-1'"
  # Назва бакету для передачі файлів через SSM, потім змінити, щоб автоматично діставало
  ansible_aws_ssm_bucket_name: "'ansible-ssm-transfer-dev'"