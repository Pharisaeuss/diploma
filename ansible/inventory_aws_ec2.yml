plugin: amazon.aws.aws_ec2

# Region is read from the AWS_REGION env var exported by the pipeline.
# Locally: export AWS_REGION=eu-central-1
regions:
  - "{{ lookup('env', 'AWS_REGION') | default('eu-central-1', true) }}"

# Filter to only running instances in the selected environment.
# PROJECT_ENV is set by the pipeline's env: block (or workflow_dispatch input).
# Locally: export PROJECT_ENV=dev
filters:
  "tag:Environment":      "{{ lookup('env', 'PROJECT_ENV') | default('dev', true) }}"
  "instance-state-name":  "running"

keyed_groups:
  - key:   tags.Role
    prefix: tag_Role
  - key:   tags.Environment
    prefix: tag_Env
  - key:   instance_type
    prefix: type

hostnames:
  - instance-id

compose:
  ansible_host: private_ip_address
  ansible_user: "'ec2-user'"