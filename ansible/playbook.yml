- name: Deploy Streamlit DevOps Dashboard
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_dir: "/var/www/streamlit"
    # Ці дані ми отримаємо з Terraform outputs
    #db_host: "{{ lookup('env', 'RDS_ENDPOINT') }}" 
    target_region: "{{ AWS_REGION | default('eu-central-1') }}"
    target_env: "{{ lookup('env', 'PROJECT_ENV') | default('dev') }}"
    app_s3_bucket: "{{ lookup('amazon.aws.aws_ssm', '/' + target_env + '/s3/app_bucket_name', region=target_region) }}"
    db_host: "{{ lookup('amazon.aws.aws_ssm', '/' + target_env + '/database/endpoint', region=target_region) }}"
    db_user: "{{ lookup('amazon.aws.aws_ssm', '/' + target_env + '/database/username', region=target_region) }}"
    db_password: "{{ lookup('amazon.aws.aws_ssm', '/' + target_env + '/database/password', region=target_region, decrypt=True) }}"

  tasks:
    - name: Debug retrieved values
      debug:
        msg: "Ansible fetched Bucket: {{ app_s3_bucket }} and DB Host: {{ db_host }}, Region: {{ target_region }}, Env: {{ target_env }}"

    - name: Install system dependencies
      yum:
        name: [python3, python3-pip, python3-devel, postgresql-devel, nginx, gcc]
        state: present

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ec2-user

    - name: Copy requirements.txt to server
      copy:
        src: templates/requirements.txt
        dest: "{{ app_dir }}/requirements.txt"
        owner: ec2-user

    - name: Install Python dependencies
      pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
        virtualenv_command: python3 -m venv

    - name: Deploy Streamlit App (with injected DB secrets)
      template:
        src: templates/app.py.j2
        dest: "{{ app_dir }}/app.py"
        owner: ec2-user
      notify: restart streamlit

    - name: Configure Streamlit systemd service
      template:
        src: templates/streamlit.service.j2
        dest: /etc/systemd/system/streamlit.service
      notify: restart streamlit

    - name: Configure Nginx as Reverse Proxy
      template:
        src: templates/nginx_app.conf.j2
        dest: /etc/nginx/conf.d/streamlit.conf
      notify: restart nginx

  handlers:
    - name: restart streamlit
      systemd: { name: streamlit, state: restarted, enabled: yes, daemon_reload: yes }
    - name: restart nginx
      systemd: { name: nginx, state: restarted, enabled: yes, daemon_reload: yes }