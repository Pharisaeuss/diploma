- name: Show hosts discovered by AWS EC2 dynamic inventory
  hosts: all
  gather_facts: false   

  tasks:
    - name: Print discovered EC2 instance metadata
      debug:
        msg:
          - "Instance ID : {{ inventory_hostname }}"
          - "Private IP  : {{ ansible_host }}"
          - "Region      : {{ placement.region      | default('unknown') }}"
          - "Instance type: {{ instance_type        | default('unknown') }}"
          - "Tags        : {{ tags                  | default({}) }}"

- name: Apply base configuration to EC2 instances
  hosts: all
  become: true            
  gather_facts: true      

  vars:
    project_env:  "{{ lookup('env', 'PROJECT_ENV')        | default('dev') }}"
    aws_region:   "{{ lookup('env', 'AWS_DEFAULT_REGION') | default('eu-central-1') }}"
    ntp_servers:
      - 169.254.169.123   # Amazon Time Sync Service (preferred inside AWS)
    ssh_banner: |
      ########################################################
      #  Managed by Ansible — unauthorised access forbidden  #
      ########################################################

  tasks:

    - name: Update all installed packages to the latest version
      yum:
        name: "*"
        state: latest
        update_cache: true
      tags: [packages, update]

    - name: Ensure common utilities are installed
      yum:
        name:
          - curl
          - wget
          - unzip
          - jq           # JSON parsing helper (useful for AWS CLI scripts)
          - awscli
          - htop
          - net-tools
          - chrony       
        state: present
      tags: [packages]

    - name: Configure chrony to use Amazon Time Sync Service
      lineinfile:
        path: /etc/chrony.conf
        regexp: "^server {{ item }}"
        line: "server {{ item }} iburst prefer"
        state: present
      loop: "{{ ntp_servers }}"
      notify: restart chrony
      tags: [ntp]

    - name: Enable and start chrony
      systemd:
        name: chronyd
        enabled: true
        state: started
      tags: [ntp]

    - name: Set SSH login banner
      copy:
        content: "{{ ssh_banner }}"
        dest: /etc/issue.net
        owner: root
        group: root
        mode: "0644"
      tags: [ssh, hardening]

    - name: Harden SSH daemon settings
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        validate: "/usr/sbin/sshd -t -f %s"
      loop:
        - { regexp: "^#?Banner",               line: "Banner /etc/issue.net" }
        - { regexp: "^#?PermitRootLogin",      line: "PermitRootLogin no" }
        - { regexp: "^#?PasswordAuthentication", line: "PasswordAuthentication no" }
        - { regexp: "^#?X11Forwarding",        line: "X11Forwarding no" }
        - { regexp: "^#?MaxAuthTries",         line: "MaxAuthTries 3" }
        - { regexp: "^#?ClientAliveInterval",  line: "ClientAliveInterval 300" }
        - { regexp: "^#?ClientAliveCountMax",  line: "ClientAliveCountMax 2" }
      notify: restart sshd
      tags: [ssh, hardening]

    - name: Ensure firewalld is installed and running
      yum:
        name: firewalld
        state: present
      tags: [firewall]

    - name: Enable firewalld service
      systemd:
        name: firewalld
        enabled: true
        state: started
      tags: [firewall]

    - name: Open required firewall ports
      firewalld:
        service: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - ssh
        - http
        - https
      tags: [firewall]

    - name: Download CloudWatch agent RPM
      get_url:
        url: "https://s3.{{ aws_region }}.amazonaws.com/amazoncloudwatch-agent/amazon_linux/amd64/latest/amazon-cloudwatch-agent.rpm"
        dest: /tmp/amazon-cloudwatch-agent.rpm
        mode: "0644"
      tags: [monitoring, cloudwatch]

    - name: Install CloudWatch agent
      yum:
        name: /tmp/amazon-cloudwatch-agent.rpm
        state: present
      tags: [monitoring, cloudwatch]

    - name: Write minimal CloudWatch agent configuration
      copy:
        content: |
          {
            "agent": {
              "metrics_collection_interval": 60,
              "run_as_user": "root"
            },
            "metrics": {
              "namespace": "CWAgent/{{ project_env }}",
              "metrics_collected": {
                "cpu":    { "measurement": ["cpu_usage_idle", "cpu_usage_user"], "metrics_collection_interval": 60 },
                "disk":   { "measurement": ["used_percent"], "resources": ["*"], "metrics_collection_interval": 60 },
                "mem":    { "measurement": ["mem_used_percent"], "metrics_collection_interval": 60 }
              }
            },
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/messages",
                      "log_group_name":  "/ec2/{{ project_env }}/system",
                      "log_stream_name": "{instance_id}"
                    }
                  ]
                }
              }
            }
          }
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        mode: "0644"
      notify: restart cloudwatch agent
      tags: [monitoring, cloudwatch]

    - name: Enable and start CloudWatch agent
      systemd:
        name: amazon-cloudwatch-agent
        enabled: true
        state: started
      tags: [monitoring, cloudwatch]

    - name: Write /etc/environment-info (project metadata)
      copy:
        content: |
          # Written by Ansible on {{ ansible_date_time.iso8601 }}
          PROJECT_ENV={{ project_env }}
          AWS_REGION={{ aws_region }}
          INSTANCE_ID={{ ansible_ec2_instance_id | default(inventory_hostname) }}
        dest: /etc/environment-info
        owner: root
        group: root
        mode: "0644"
      tags: [metadata]

  handlers:
    - name: restart chrony
      systemd:
        name: chronyd
        state: restarted

    - name: restart sshd
      systemd:
        name: sshd
        state: restarted

    - name: restart cloudwatch agent
      systemd:
        name: amazon-cloudwatch-agent
        state: restarted